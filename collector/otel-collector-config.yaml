receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

exporters:
  # Metrics (tokens, cost, session counts, lines-of-code, active-time) are
  # exposed here for Prometheus to scrape.
  prometheus:
    endpoint: 0.0.0.0:8889

  # Logs (per-prompt, per-tool-call, per-API-request events) are structured
  # and high-cardinality, so they land in ClickHouse for querying/filtering
  # rather than in Prometheus.
  # Logs and traces both land in ClickHouse -- traces cover agents like
  # Cursor that emit spans (via a hook shim) instead of native OTel metrics/logs.
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    database: otel
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    ttl: 2160h # 90 days
    create_schema: true

  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse, debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse, debug]
