[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentobs"
version = "0.1.0"
description = "Install, connect, and export telemetry for AI coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "questionary>=2.0",
    # Needed by agentobs.cursor_hook (Cursor's OTel hook shim, no separate install).
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
]

[project.scripts]
agentobs = "agentobs.main:app"
agentobs-cursor-hook = "agentobs.cursor_hook.receiver:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentobs"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
